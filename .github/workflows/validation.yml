name: Financial and security validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      AI_ACCESS_POLICY: disabled
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.10'
      - run: python -m pip install -r requirements-dev.lock -r requirements-controlled.lock
      - run: python -m pip check
      - run: python -m pytest -q
      - run: python scripts/independent_audit.py --output audit-results.json
      - run: python -m pip_audit -r requirements-controlled.lock --no-deps --disable-pip
